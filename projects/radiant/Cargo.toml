[workspace]
resolver = "3"
members = [
    "crates/radiant-domain",
    "crates/radiant-commands",
    "crates/radiant-session",
    "crates/radiant-app",
    "crates/radiant-ui",
    "crates/radiant-graph",
    "crates/radiant-media",
    "crates/radiant-engine",
    "crates/radiant-audio",
    "crates/radiant-pipewire",
    "crates/radiant-plugins",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["Radiant contributors"]
repository = "https://github.com/radiantdaw/radiant"

[workspace.dependencies]
anyhow = "1.0"
arc-swap = "1.7"
clack-host = "0.1.1"
lilv = "0.2.4"
alsa = "0.11.0"
allocation-counter = "0.8.1"
claxon = "0.4.3"
cpal = { version = "0.17.3", features = ["audio_thread_priority", "jack"] }
gtk4 = { version = "0.11.4", features = ["v4_14"] }
hound = "3.5.1"
libadwaita = { version = "0.9.2", features = ["v1_6"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rtrb = "0.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.23"
uuid = { version = "1.18", features = ["serde", "v4"] }
vst3-host = { version = "0.9.0", default-features = false, features = ["process-isolation"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
